name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "exact-*"

permissions:
  contents: read

jobs:
  release-candidate:
    name: Release-candidate gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -c requirements-dev.txt '.[dev,audit]'

      - name: Release-candidate verification
        run: python scripts/verify_release_candidate.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: validex-ci-diagnostics
          path: |
            /tmp/validex-external-validation.json
            /tmp/validex-external-validation.md
          if-no-files-found: ignore
          retention-days: 14
