[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validex"
description = "Privacy-first local metabolomics validity auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Aryav Thakur" },
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "httpx>=0.27.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "pytest>=8.0.0",
  "types-setuptools>=70.0.0",
]
audit = [
  "pip-audit>=2.7.3",
]

[project.scripts]
validex = "validex.cli:main"

[tool.setuptools.packages.find]
include = ["validex*"]

[tool.setuptools.dynamic]
version = { attr = "validex.__version__" }

[tool.setuptools.package-data]
validex = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "repo_policy: requires a Git source checkout and validates repository tracking/ignore policy",
]
