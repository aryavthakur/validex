[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validex"
version = "0.1.0"
description = "Privacy-first local metabolomics validity auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
validex = "validex.cli:main"

[tool.setuptools.packages.find]
include = ["validex*"]

[tool.setuptools.package-data]
validex = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
